<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Calendar body -->
  <rect x="4" y="10" width="40" height="34" rx="5" ry="5" fill="#863bff"/>
  <!-- Calendar header -->
  <rect x="4" y="10" width="40" height="14" rx="5" ry="5" fill="#6a1fe0"/>
  <rect x="4" y="18" width="40" height="6" fill="#6a1fe0"/>
  <!-- Binding pegs -->
  <rect x="14" y="4" width="4" height="12" rx="2" fill="#4a0fb0"/>
  <rect x="30" y="4" width="4" height="12" rx="2" fill="#4a0fb0"/>
  <!-- Grid dots (days) -->
  <rect x="10" y="30" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
  <rect x="21" y="30" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
  <rect x="32" y="30" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
  <rect x="10" y="39" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
  <rect x="21" y="39" width="5" height="5" rx="1" fill="#c084fc" opacity="1"/>
  <rect x="32" y="39" width="5" height="5" rx="1" fill="white" opacity="0.9"/>
</svg>
